[package]
name = "sparrow-web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
benchmark = []
threads = ["dep:wasm-bindgen-rayon", "dep:rayon"]

[[example]]
name = "benchmark"
required-features = ["benchmark"]

[dependencies]
log = "0.4"
wasm-bindgen-rayon = { version = "=1.3.0", optional = true }
rayon = { version = "1.11", optional = true }
sparrow = { path = "../../../sparrow" }
jagua-rs = { path = "../../../jagua-rs/jagua-rs", features = ["spp"] }
rand = "0.10"
serde_json = "1.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
usvg = { version = "=0.48.1", default-features = false }

[profile.release]
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
