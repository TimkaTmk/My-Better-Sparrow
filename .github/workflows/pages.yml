name: Deploy Sparrow Studio to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sparrow-studio/web/package-lock.json

      - name: Set up stable Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install pinned nightly Rust
        run: rustup toolchain install nightly-2026-08-30 --component rust-src --target wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install web dependencies
        working-directory: sparrow-studio/web
        run: npm ci

      - name: Build WebAssembly for unit tests
        working-directory: sparrow-studio/web
        run: npm run wasm:build

      - name: Run unit tests
        working-directory: sparrow-studio/web
        run: npm test

      - name: Install Chromium for Playwright
        working-directory: sparrow-studio/web
        run: npx playwright install --with-deps chromium

      - name: Build production site and all WASM variants
        working-directory: sparrow-studio/web
        run: npm run build

      - name: Run Chromium production tests
        working-directory: sparrow-studio/web
        run: npx playwright test --project=chromium

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sparrow-studio/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
